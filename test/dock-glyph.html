  body{margin:0;background:#efe6d3;color:#e8dcc9;display:grid;grid-template-columns:repeat(2,236px);gap:14px;padding:14px}

  .zoom{background:var(--dark);color:#e8dcc9;border:1px solid #4a4238;border-radius:48px;
    width:224px;height:224px;display:flex;align-items:center;justify-content:center}
  .zoom svg{width:152px;height:76px;display:block}
</style>
