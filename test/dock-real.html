<!doctype html>
<meta charset="utf-8">
<title>real-size dock glyph — canister-only candidates</title>
<style>
  :root{--dark:#24211D;--red:#D94B37}
  @font-face{font-family:'PC Cond';src:url('../assets/fonts/roboto-condensed-700.woff2') format('woff2');font-weight:700}
  body{margin:0;background:#efe6d3;color:#e8dcc9;display:flex;gap:14px;padding:14px}
  .cell{display:flex;flex-direction:column;gap:8px}
  .lbl{font-family:'PC Mono',ui-monospace,monospace;font-size:10px;color:#574f45;letter-spacing:.1em}
  /* the shipped button: 56px square, 38x19 art. This page renders the SAME art at the SAME
     size, so legibility is judged at the size a phone actually shows (dpr 2 screenshot). */
  .sidebtn{background:var(--dark);color:#e8dcc9;border:1px solid #4a4238;border-radius:12px;
    width:56px;height:56px;padding:0;display:flex;align-items:center;justify-content:center}
  .sidebtn svg{width:38px;height:19px;display:block}
  .zoom{background:var(--dark);color:#e8dcc9;border:1px solid #4a4238;border-radius:48px;
    width:224px;height:224px;display:flex;align-items:center;justify-content:center}
  .zoom svg{width:152px;height:76px;display:block}
</style>

<!-- A: lid wider than body + a label band carved across the whole body -->
<div class="cell">
  <span class="lbl">A · real size</span>
  <button class="sidebtn"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="2.5" y="4.5" width="15" height="12" rx="2.5"/><circle cx="10" cy="10.5" r="3.6"/><rect x="5.5" y="1.8" width="5.4" height="2.6" rx="1.2"/>
    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
      <rect x="27.2" y="8.4" width="10.4" height="3.2" style="fill:var(--dark)"/>
    </g>
  </svg></button>
  <span class="lbl">A · magnified</span>
  <div class="zoom"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="2.5" y="4.5" width="15" height="12" rx="2.5"/><circle cx="10" cy="10.5" r="3.6"/><rect x="5.5" y="1.8" width="5.4" height="2.6" rx="1.2"/>
    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
      <rect x="27.2" y="8.4" width="10.4" height="3.2" style="fill:var(--dark)"/>
    </g>
  </svg></div>
</div>

<div class="cell">

  <button class="sidebtn"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
      <rect x="28.6" y="8.6" width="7.6" height="3.4" rx="1" style="fill:var(--dark)"/>
    </g>
  </svg></button>
  <span class="lbl">B · magnified</span>
  <div class="zoom"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="2.5" y="4.5" width="15" height="12" rx="2.5"/><circle cx="10" cy="10.5" r="3.6"/><rect x="5.5" y="1.8" width="5.4" height="2.6" rx="1.2"/>
    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
      <rect x="28.6" y="8.6" width="7.6" height="3.4" rx="1" style="fill:var(--dark)"/>
    </g>
  </svg></div>
</div>

<!-- C: pure silhouette, nothing carved out -->
<div class="cell">
  <span class="lbl">C · real size</span>
  <button class="sidebtn"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="2.5" y="4.5" width="15" height="12" rx="2.5"/><circle cx="10" cy="10.5" r="3.6"/><rect x="5.5" y="1.8" width="5.4" height="2.6" rx="1.2"/>
    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
    </g>
  </svg></button>
  <span class="lbl">C · magnified</span>
  <div class="zoom"><svg viewBox="0 0 44 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="2.5" y="4.5" width="15" height="12" rx="2.5"/><circle cx="10" cy="10.5" r="3.6"/><rect x="5.5" y="1.8" width="5.4" height="2.6" rx="1.2"/>
    <g fill="currentColor" stroke="none">
      <rect x="25.6" y="1.2" width="13.6" height="2.2" rx="1.1"/>
      <rect x="27.2" y="3.6" width="10.4" height="12.4" rx="2.2"/>
    </g>
  </svg></div>
</div>
